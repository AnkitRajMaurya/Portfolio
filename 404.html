<!DOCTYPE html>
<html lang="en" class="dark-editorial">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Ankit Raj Maurya</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080807" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    .error-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .error-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--accent-orange);
      margin-bottom: 1.5rem;
    }

    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 400;
      line-height: 1;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }

    .error-code em {
      font-style: italic;
      color: #fff;
    }

    .error-desc {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
  </style>
</head>

<body>
  <!-- Ambient Grid Backdrop -->
  <div class="grid-backdrop" aria-hidden="true">
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
  </div>

  <main class="error-layout">
    <span class="error-tag">404 // ROUTE NOT FOUND</span>
    <h1 class="error-code">404 <em>Page</em></h1>
    <p class="error-desc">
      The coordinates you requested do not exist or have been relocated in the latest edition of the portfolio.
    </p>
    <div class="error-actions">
      <a href="/" class="btn-pill btn-primary">
        <span>RETURN TO HOMEPAGE</span>
        <span class="btn-icon" aria-hidden="true">→</span>
      </a>
    </div>
  </main>
</body>

</html>
